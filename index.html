<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le'Playground</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
}

header{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:25px;
background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.65)),
radial-gradient(circle at top left,#00f7ff55,transparent 35%),
radial-gradient(circle at bottom right,#ff00d455,transparent 35%),
radial-gradient(circle at center,#8a2be255,transparent 40%);
}

.logo{
width:140px;
margin-bottom:20px;
}

.brand{
font-family:'Great Vibes',cursive;
font-size:clamp(2.5rem,8vw,5rem);
color:white;
text-shadow:0 0 10px #00f7ff, 0 0 20px #ff00d4;
}

.tagline{
max-width:800px;
font-size:1.1rem;
margin:20px auto;
color:#ddd;
padding:0 10px;
}

.btn-wrap{
margin-top:20px;
}

.btn{
display:inline-block;
padding:14px 28px;
margin:8px;
border-radius:40px;
text-decoration:none;
font-weight:700;
transition:.3s;
}

.ig{
background:#ff00d4;
color:white;
}

.book{
background:#00f7ff;
color:black;
}

section{
padding:90px 8%;
}

.section-title{
font-size:2.5rem;
text-align:center;
margin-bottom:45px;
color:#00f7ff;
}

.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:rgba(255,255,255,.06);
padding:30px;
border-radius:25px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.gallery img{
width:100%;
height:420px;
object-fit:cover;
border-radius:25px;
box-shadow:0 0 20px rgba(0,247,255,.25);
}

footer{
text-align:center;
padding:40px;
background:#080808;
}
</style>
</head>
<body>

<header>

<img src="./logo.png" class="logo" alt="Le'Playground Logo">

<h1 class="brand">Le’Playground</h1>

<p class="tagline">
Where movement, vision, and artistry collide through choreography,
creative direction, and elevated performance experiences.
</p>

<div class="btn-wrap">
<a class="btn ig" href="https://instagram.com/leplayground19" target="_blank">Instagram</a>
<a class="btn book" href="https://cash.app/$TahaneeWaqia3" target="_blank">Book Now</a>
</div>

</header>

<section>
<h2 class="section-title">Creative Services</h2>

<div class="services">
<div class="card"><h3>Choreography</h3></div>
<div class="card"><h3>Movement Coaching</h3></div>
<div class="card"><h3>Artist Development</h3></div>
<div class="card"><h3>Creative Direction</h3></div>
</div>
</section>

<section>
<h2 class="section-title">The Playground</h2>

<div class="gallery">
<img src="./photo1.jpeg" alt="Photo 1">
<img src="./photo2.jpeg" alt="Photo 2">
<img src="./photo3.jpeg" alt="Photo 3">
</div>

</section>

<footer>
Le’Playground © 2026
</footer>

</body>
</html>
